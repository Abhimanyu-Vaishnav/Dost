<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d9bf0" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#dostGrad)" />

  <!-- Inner Dark Core Container -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="#0b0e14" opacity="0.4" />

  <!-- Stylized DOST 'D' + Sparkle Icon -->
  <g filter="url(#glow)">
    <!-- Primary D Arc -->
    <path d="M 140 130 H 250 C 330 130, 380 180, 380 256 C 380 332, 330 382, 250 382 H 140 Z" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Sparkle Accent inside D -->
    <path d="M 240 210 L 252 244 L 286 256 L 252 268 L 240 302 L 228 268 L 194 256 L 228 244 Z" fill="#ffffff" />
    
    <!-- Mini Dots -->
    <circle cx="310" cy="190" r="14" fill="#60a5fa" />
    <circle cx="310" cy="322" r="10" fill="#f472b6" />
  </g>
</svg>
